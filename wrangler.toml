name = "fullhouse"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/e/*", "/i/*", "/img/*", "/mcp", "/mcp/*", "/live.txt"]

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

[ai]
binding = "AI"

[vars]
EXAMPLE_VENUE = "uqff6kyvx73m"
AI_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
QLOO_DAILY_BUDGET = "4000"

[[durable_objects.bindings]]
name = "VENUE"
class_name = "VenueAgent"

[[durable_objects.bindings]]
name = "METER"
class_name = "Meter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VenueAgent", "Meter"]

[observability]
enabled = true
