name = "fullhouse"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/e/*", "/mcp", "/mcp/*"]

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
QLOO_DAILY_BUDGET = "4000"

[[durable_objects.bindings]]
name = "VENUE"
class_name = "VenueAgent"

[[durable_objects.bindings]]
name = "METER"
class_name = "Meter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VenueAgent", "Meter"]

[observability]
enabled = true
